<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume → Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f2;--card:rgba(255,255,255,.72);--ink:#1c1e22;--mut:#6b7078;--line:rgba(0,0,0,.09);--acc:#4b5058;--acc2:rgba(75,80,88,.1);--ok:#059669;--r:22px;--fld:rgba(255,255,255,.9);--g:linear-gradient(135deg,#5a5f68,#2b2e33)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.005em}
::selection{background:var(--acc);color:#fff}
header{padding:22px 20px 8px;max-width:1150px;margin:auto}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1150px;margin:auto;padding:12px 20px 60px}
.steps{display:flex;gap:8px;margin:14px 0}
.steps button{flex:1;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;color:var(--mut);cursor:pointer;text-align:left}
.steps button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2);font-weight:600}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.drop{border:2px dashed #d6d8db;border-radius:var(--r);padding:38px 16px;text-align:center;background:#fafaff;cursor:pointer;transition:.15s}
.drop.over{background:var(--acc2);border-color:var(--acc)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
textarea,input[type=text],select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
button.btn{font:inherit;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
a.btn{font:inherit;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);display:inline-block}
a.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.btn:hover{border-color:#94a3b8}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:#33373d;border-color:#33373d}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}.steps button{font-size:12px;padding:8px}}
.cands{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip i{font-style:normal;opacity:.7;margin-left:6px}
details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
details.sec>summary{list-style:none;padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .cnt{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
details.sec .body{padding:2px 14px 12px 38px;border-top:1px solid var(--line)}
.it{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.it input{margin-top:4px}
.ent{margin-top:8px}.ent>.it{font-weight:600}
.ent .sub-b{margin-left:24px}
.meta{color:var(--mut);font-weight:400;font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 6px rgba(20,22,58,.15)}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--acc);outline:2px solid #fff;outline-offset:-3px;box-shadow:0 0 0 3px var(--acc2)}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.tog{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.stage{background:#0b1020;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
.frame{position:relative;background:#000;width:min(100%,131vh);aspect-ratio:16/9}
.frame canvas,.frame video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.frame:fullscreen{width:100vw!important;height:100vh!important;aspect-ratio:auto!important}
.frame:-webkit-full-screen{width:100vw!important;height:100vh!important;aspect-ratio:auto!important}
.ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9%;box-sizing:border-box;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,.08) 45%,rgba(0,0,0,.28))}
.bigplay{width:96px;height:96px;border-radius:50%;border:none;background:rgba(255,255,255,.96);cursor:pointer;box-shadow:0 10px 34px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.bigplay::before{content:'';border-left:30px solid #3a3d43;border-top:19px solid transparent;border-bottom:19px solid transparent;margin-left:8px}
.bigplay:hover{transform:scale(1.08)}
.ovlabel{position:absolute;left:20px;bottom:16px;color:#fff;font-size:15px;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.ovlabel b{font-size:19px}
.rec{position:absolute;left:14px;top:14px;background:rgba(220,38,38,.92);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px}
.fsbtn{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:10px;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.fsbtn:hover{background:rgba(0,0,0,.8)}
.avts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.avt{border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.avt canvas{border-radius:8px;display:block}
.avt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.avt span{font-size:12px;font-weight:600}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.th{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.face{border-color:var(--acc)}
.th button{position:absolute;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
.th .x{top:3px;right:3px}.th .st{left:3px;bottom:3px}.th.face .st{background:var(--acc)}
.rec-row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.rec-row .btn{padding:5px 10px;font-size:13px}
.recinfo{font-size:12px;color:var(--mut)}
.scene.recording{border-color:#dc2626;box-shadow:0 0 0 3px #fee2e2}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.fmtWrap{width:210px;max-width:46%;display:flex;flex-direction:column;gap:6px}
.fmt{width:100%;text-align:center;align-items:center;justify-content:center;padding:16px 8px;border:2px solid var(--line);background:#fff;border-radius:14px;font:inherit;cursor:pointer;color:var(--ink,#222);display:flex;flex-direction:column;gap:8px}
.fmt strong{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.25}
.fmt.done::after{content:'✓ ready';display:block;font-size:10.5px;color:#15803d;font-weight:700}
.fmt.on{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 3px var(--acc2)}
.demoBtn{width:100%;padding:7px;border:1px solid var(--line);background:transparent;border-radius:9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--acc)}
.demoBtn:hover{background:var(--acc2)}
.fmt small{color:var(--mut);font-size:12px;line-height:1.3}
.fp{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;position:relative;font-size:10px;text-align:center}
.fp.mv{background:linear-gradient(135deg,#0b1a26,#4a3a2a);color:#f3d9b0}
.fp.mv em{font-style:normal;font-size:19px}
.fp.pr{background:linear-gradient(135deg,#f1f2f4,#e3e5e8)}
.fp.pr em{font-style:normal;font-size:19px}

.tabp>h2:first-child{margin-top:8px}
.tabp2 .card:first-child h2{margin-top:0}
.seg{display:flex;gap:6px;margin:4px 0 6px}
.seg button{flex:1;padding:10px 8px;border:2px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.seg-icon button{font-size:26px;line-height:1;padding:14px 8px}
.scenes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;width:0;background:var(--acc);transition:width .2s}
.scene{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.scene .h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.scene .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700;background:var(--acc2);padding:2px 8px;border-radius:99px}
.scene .h .sp{flex:1}
.scene small{color:var(--mut);display:block;margin:6px 0 3px;font-size:12px;font-weight:600}
.ic{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer}
.note{font-size:12.5px;color:var(--mut);background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:10px}
.err{color:#b91c1c;font-size:13px;margin-top:8px}
#cands{display:none!important}
.hide{display:none!important}
#s2{position:fixed;inset:0;z-index:80;background:rgba(22,22,25,.6);display:flex;flex-direction:column;align-items:center;overflow:auto;padding:56px 16px 40px;margin:0}
#s2 .card{width:100%;max-width:480px}
#s2Close{position:fixed;top:14px;right:16px;z-index:81;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#14163a;font-size:18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#s2Close:hover{background:#fff}
body.popupOpen{overflow:hidden}


/* ---- glass theme ---- */
html{color-scheme:light}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:#eef0f2;background-image:radial-gradient(620px 520px at 8% 6%,#e4e6e9 0,transparent 70%),radial-gradient(700px 560px at 92% 4%,#e9eaec 0,transparent 70%),radial-gradient(760px 620px at 70% 96%,#dfe1e4 0,transparent 70%),radial-gradient(600px 500px at 4% 90%,#e7e8ea 0,transparent 70%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
header{padding:34px 20px 4px}
header p{display:none}
h1{font-size:30px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.steps{gap:6px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.75);padding:5px;border-radius:99px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 8px 32px rgba(40,42,48,.14)}
.steps button{border:none;background:transparent;border-radius:99px;text-align:center;padding:10px 14px;font-weight:600;color:var(--mut);transition:.2s}
.steps button.on{background:rgba(255,255,255,.85);color:var(--acc);box-shadow:0 4px 16px rgba(40,42,48,.18)}
.card{background:var(--card);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:0 12px 40px rgba(40,42,48,.16),inset 0 1px 0 rgba(255,255,255,.8);padding:22px;transition:box-shadow .2s,transform .2s}
.card h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.card[style*="--acc2"]{background:rgba(255,255,255,.5)!important;border-color:rgba(255,255,255,.8)!important}
.drop{background:rgba(255,255,255,.35);border:2px dashed rgba(75,80,88,.4);padding:54px 16px;transition:.2s}
.drop:hover,.drop.over{background:rgba(255,255,255,.65);border-color:var(--acc);transform:translateY(-1px)}
textarea,input[type=text],select{background:var(--fld);border:1.5px solid rgba(75,80,88,.28);color:var(--ink);border-radius:14px;padding:10px 13px;transition:.15s;box-shadow:inset 0 1px 3px rgba(40,42,48,.08)}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
button.btn,a.btn{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);color:var(--ink);border-radius:14px;padding:10px 18px;font-weight:600;transition:.15s;text-decoration:none;box-shadow:0 4px 14px rgba(40,42,48,.1)}
button.btn:hover,a.btn:hover{background:rgba(255,255,255,.9);border-color:#fff}
button.pri,a.btn.pri{background:var(--g);border:none;color:#fff;box-shadow:0 10px 26px rgba(50,54,60,.35)}
button.pri:hover,a.btn.pri:hover{background:var(--g);filter:brightness(1.07);transform:translateY(-1px)}
button.btn:active,a.btn:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.45}
.chip{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.85);color:var(--ink)}
.chip.on{background:var(--g);border:none;color:#fff}
details.sec,.scene,.avt,.ic{background:rgba(255,255,255,.45);color:var(--ink);border-color:rgba(255,255,255,.8)}
details.sec{border-radius:16px}
details.sec .body{border-top-color:rgba(255,255,255,.7)}
.seg{background:rgba(255,255,255,.4);padding:5px;border-radius:16px;border:1px solid rgba(255,255,255,.75)}
.seg button{border:none;border-radius:12px;background:transparent;color:var(--mut)}
.seg button.on{background:rgba(255,255,255,.9);color:var(--acc);box-shadow:0 4px 14px rgba(40,42,48,.16)}
.fmt{background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.8);border-radius:16px;color:var(--ink);transition:.2s;box-shadow:0 6px 18px rgba(40,42,48,.1)}
.fmt:hover{transform:translateY(-2px);background:rgba(255,255,255,.62)}
.fmt.on{background:rgba(255,255,255,.75);border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2),0 10px 24px rgba(75,80,88,.22)}
.fmt.done::after{color:var(--ok)}
.fp{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.demoBtn{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.75);border-radius:12px;color:var(--acc)}
.demoBtn:hover{background:rgba(255,255,255,.7)}
.avt{border-radius:18px;transition:transform .18s,box-shadow .18s}
.avt:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(40,42,48,.18)}
.avt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.avStage{width:190px;height:190px;margin:4px auto 18px;border-radius:50%;position:relative;padding:10px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,.25) 55%,rgba(255,255,255,.08) 75%),var(--g);box-shadow:0 22px 48px rgba(40,42,48,.28),0 0 0 1px rgba(255,255,255,.6) inset,0 0 0 8px rgba(255,255,255,.25)}
.avStage::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(90,95,104,.18),transparent 70%);z-index:-1}
.avStage canvas{box-shadow:0 8px 22px rgba(20,20,24,.22),0 0 0 3px rgba(255,255,255,.85)}
.th{border-color:rgba(255,255,255,.85)}
.prog{background:rgba(255,255,255,.55);height:6px}
#s2{backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%)}
.prog div{background:var(--g)}
.stage{background:#16181b;border-radius:26px;box-shadow:0 24px 60px rgba(20,20,24,.35)}
.scene .k{color:var(--acc);background:rgba(255,255,255,.7)}
.scene small{color:var(--mut)}
.scene.recording{border-color:#f43f5e;box-shadow:0 0 0 3px rgba(244,63,94,.2)}
.err{color:#be123c}
.meta,.recinfo{color:var(--mut)}
.swatches .sw.on{outline-color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(75,80,88,.3);border-radius:9px}
/* no description text */
#estimate,#status,#ovLen,.card>.sub{display:none!important}
#lenMeter{display:inline-block;background:rgba(255,255,255,.6);padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;margin:6px 0}
@media(max-width:860px){.steps{border-radius:22px}.steps button{padding:8px 6px}}

.qa-card{background:rgba(255,255,255,.4);border:1.5px solid rgba(75,80,88,.22);border-radius:18px;padding:16px}
.qa-q{font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1}
.qa-q-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.mic-icon{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(75,80,88,.25);background:rgba(255,255,255,.7);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;transition:.15s}
.mic-icon:hover{background:#fff}
.mic-icon.rec{background:#f43f5e;border-color:#f43f5e;animation:pulse 1.2s infinite}
.qa-dots{display:flex;gap:6px;margin-bottom:10px}
.qa-dots span{width:8px;height:8px;border-radius:99px;background:rgba(75,80,88,.25)}
.qa-dots span.on{background:var(--acc);width:20px}
.qa-dots span.done{background:var(--ok,#059669)}
button.mic{position:relative}
button.mic.rec{background:#f43f5e;border-color:#f43f5e;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.5)}50%{box-shadow:0 0 0 8px rgba(244,63,94,0)}}
</style>
</head>
<body>
<header class="hide">
  <h1>Resume → Video</h1>
</header>
<main>
  <div class="steps hide">
    <button id="st1" class="on">1 · Build</button>
    <button id="st2" disabled>2 · Video</button>
  </div>

  <div id="cands" class="cands hide"></div>

  <!-- STEP 1 -->
  <section id="s1">
    <div class="card hide" id="demoCard" style="background:var(--acc2);border-color:#d6d8db">
      <div class="row" style="justify-content:space-between">
        <div><h2>See it in action</h2></div>
        <button class="btn pri" id="demo">▶ Watch demo</button>
      </div>
    </div>

    <div class="card" style="padding-bottom:14px">
      <div class="seg" id="s2Tabs" role="tablist">
        <button type="button" data-t2="fmt" class="on">🎬 Format</button>
        <button type="button" data-t2="av">🧑‍💼 Avatar</button>
        <button type="button" data-t2="script">📝 Script</button>
      </div>
    </div>

    <div class="tabp2" id="t2-fmt">
      <div class="card">
        <h2>Choose your video format</h2>
        <div class="fmts" id="fmtPicker">
          <button type="button" class="fmt" data-v="movie"><canvas class="fp fmtThumb" data-kind="movie" width="220" height="220" style="width:100%;height:100%"></canvas><strong>🎬 Cinematic short film</strong></button>
          <button type="button" class="fmt" data-v="presenter" data-aspect="16:9"><canvas class="fp fmtThumb" data-kind="presenter" width="220" height="220" style="width:100%;height:100%"></canvas><strong>🧑‍💼 Presenter — Landscape</strong></button>
          <button type="button" class="fmt" data-v="presenter" data-aspect="9:16"><canvas class="fp fmtThumb" data-kind="presenter" width="220" height="220" style="width:100%;height:100%"></canvas><strong>📱 Reels / Shorts</strong></button>
          <button type="button" class="fmt" data-v="presenter" data-aspect="1:1"><canvas class="fp fmtThumb" data-kind="presenter" width="220" height="220" style="width:100%;height:100%"></canvas><strong>🖼️ Square post</strong></button>
        </div>
      </div>
      <div class="card">
        <h2>Colour &amp; style options</h2>
        <div id="movieOpts"><label class="f">Colour grade</label><select id="grade"><option value="0">Blockbuster (teal &amp; orange)</option><option value="1">Golden hour</option><option value="2">Neon night</option><option value="3">Noir (black &amp; white)</option></select></div>

let ttsWorker=null,_wid=0;

      else if(d.type==='error'){reject(new Error(d.message));w.removeEventListener('message',handler);}

  }

};

<script>
"use strict";

 {n:'Emerald',bg1:'#022c22',bg2:'#065f46',acc:'#34d399',txt:'#f0fdf4',mut:'#bbf7d0',cap:'rgba(0,0,0,.5)'},

/* ---------- parsing ---------- */
const HEADINGS=[
 ['summary','Summary',/^(professional\s+)?(summary|profile|about(\s+me)?|objective|career\s+objective)$/i],
 ['experience','Experience',/^((work|professional|relevant)\s+)?(experience|employment(\s+history)?|work\s+history|career\s+history)$/i],
 ['education','Education',/^(education|academic\s+\w+|qualifications)$/i],

 ['certs','Certifications',/^(certifications?|licen[sc]es?|courses|training)(\s*(&|and)\s*\w+)?$/i],
 ['achievements','Achievements',/^(achievements|awards|honou?rs[\s-]*awards|honou?rs|accomplishments|publications|awards\s*(&|and)\s*honou?rs)$/i],

const BUL=/^[•·▪■●◦‣▸►◆\-–—*]\s*/;

  if(jdWords.size){const words=b.toLowerCase().match(/[a-z]{4,}/g)||[];const hit=words.filter(w=>jdWords.has(w)).length;if(hit) s+=Math.min(3,hit);}

function parseResume(text,fileName){

    }else if(r.key==='summary'){
      const sents=r.lines.join(' ').replace(BUL,'').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>3);
      items=sents.map(t=>({t,on:false}));
    }else if(r.key==='skills'){

function autoPick(c){
  const lim={summary:2,skills:12,education:2,certs:3,achievements:3,languages:6};

    }
    rows.sort((a,b)=>b.y-a.y);
    rows.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);out.push(r.it.map(i=>i.s).join(' '));});
  }
  return out.join('\n');
}

/* ---------- LinkedIn import ---------- */
function fixLinkedIn(t){
  if(!/linkedin\.com\/in\//i.test(t)) return t;
  const L=t.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!/^contact$/i.test(L[0])) return t;
  const mi=L.findIndex((l,i)=>i>3&&/^(summary|experience)$/i.test(l));
  if(mi<4) return t;
  const head=L.slice(0,mi), main=L.slice(mi).filter(l=>!/^page\s+\d+\s+of\s+\d+$/i.test(l));
  const [name,headline,loc]=head.slice(-3), side=[];let skip=false;
  for(const l of head.slice(0,-3)){
    if(/^contact$/i.test(l)){skip=true;continue;}
    if(/^(top skills|languages|certifications|honors-awards|publications)$/i.test(l)) skip=false;
    if(!skip) side.push(/^top skills$/i.test(l)?'Skills':/^honors-awards$/i.test(l)?'Awards':l);
  }
  const url=(head.find(l=>/linkedin\.com\/in\//i.test(l))||'');
  return [name,headline,[loc,url].filter(Boolean).join(' | '),'',...main,'',...side].join('\n');
}
function parseCSV(s){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"') q=true; else if(c===','){r.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[];}
    else f+=c;}
  if(f||r.length){r.push(f);rows.push(r);}
  if(!rows.length) return [];
  const hd=rows[0].map(x=>x.trim().replace(/^﻿/,''));
  return rows.slice(1).map(r=>Object.fromEntries(hd.map((k,i)=>[k,(r[i]||'').trim()])));
}
async function linkedInFromCSV(files){
  const by={};
  for(const f of files){const n=f.name.toLowerCase();
    const k=['profile','positions','education','skills','certifications','projects','honors'].find(x=>n.includes(x));
    if(k) by[k]=parseCSV(await f.text());}
  if(!Object.keys(by).length) return null;
  const pr=(by.profile||[])[0]||{};
  const out=[[[pr['First Name'],pr['Last Name']].filter(Boolean).join(' ')||'LinkedIn profile',pr['Headline']||'',pr['Geo Location']||''].filter((x,i)=>i===0||x).join('\n'),''];
  if(pr['Summary']) out.push('Summary',pr['Summary'],'');
  const yr=s=>(s||'').replace(/^.*?(\d{4}).*$/,'$1')||'';
  if(by.positions){out.push('Experience');
    for(const x of by.positions){
      const span=[yr(x['Started On']),yr(x['Finished On'])||'Present'].filter(Boolean).join(' – ');
      out.push(x['Title']||'Role',[x['Company Name'],x['Location']].filter(Boolean).join(', ')+(span?' · '+span:''));
      (x['Description']||'').split(/\n|(?<=\.)\s+(?=[A-Z])/).map(s=>s.replace(/^[•\-*\s]+/,'').trim()).filter(s=>s.length>8).slice(0,6).forEach(s=>out.push('• '+s));
      out.push('');}}
  if(by.education){out.push('Education');
    for(const x of by.education) out.push([x['Degree Name'],x['School Name']].filter(Boolean).join(' — ')+(yr(x['End Date'])?', '+yr(x['End Date']):''));
    out.push('');}
  if(by.skills){out.push('Skills',by.skills.map(x=>x['Name']).filter(Boolean).slice(0,25).join(', '),'');}
  if(by.certifications){out.push('Certifications');by.certifications.forEach(x=>x['Name']&&out.push('• '+x['Name']+(x['Authority']?' — '+x['Authority']:'')));out.push('');}
  if(by.projects){out.push('Projects');by.projects.forEach(x=>x['Title']&&out.push('• '+x['Title']+(x['Description']?': '+x['Description']:'')));out.push('');}
  if(by.honors){out.push('Awards');by.honors.forEach(x=>x['Title']&&out.push('• '+x['Title']));}
  return out.join('\n');
}
async function readFile(f){
  const n=f.name.toLowerCase();

}

function wireMic(btn,onFinal,onInterim){
  if(!SR){btn.classList.add('hide');return;}
  let rec=null,on=false;
  btn.onclick=()=>{
    if(on){try{rec.stop();}catch(e){}return;}
    rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
    let base=onInterim?onInterim(''):'';
    rec.onresult=e=>{
      let fin='',intr='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t+' '; else intr+=t;
      }
      if(fin) onFinal(fin);
      if(onInterim) onInterim(intr);
    };
    rec.onend=()=>{on=false;btn.classList.remove('rec');};
    rec.onerror=()=>{on=false;btn.classList.remove('rec');};
    try{rec.start();on=true;btn.classList.add('rec');}catch(e){}
  };
}

const clean=s=>s.replace(/\s+/g,' ').replace(/[.;,\s]+$/,'').trim();
const short=(s,n)=>s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s;
let TARGET=60,lastTrim=false;
const sents=t=>(String(t||'').match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean);
const skillsNarr=l=>`Core strengths include ${l.length>1?l.slice(0,-1).join(', ')+' and '+l[l.length-1]:l[0]}.`;

function fitScenes(sc){
  const est=a=>a.reduce((t,s)=>t+calcDur(s),0);
  const before=est(sc);lastTrim=false;
  const rebuild=s=>{s.narration=s.parts.map(x=>x.t).join(' ');if(s.lineParts)s.lines=s.parts.filter(x=>x.l).map(x=>x.l);};
  let g=0;
  while(est(sc)>TARGET&&g++<80){
    let bs=-1,bp=-1,bmax=0;
    sc.forEach((s,i)=>{(s.parts||[]).forEach((x,j)=>{if(x.p>=bmax&&x.p>0){bmax=x.p;bs=i;bp=j;}});});
    if(bs<0) break;
    const s=sc[bs];s.parts.splice(bp,1);
    if(!s.parts.length&&s.kind!=='intro'&&s.kind!=='outro') sc.splice(bs,1); else rebuild(s);
  }
  if(est(sc)<before-0.5) lastTrim=true;
  return sc;
}

  if(!c) return [];

  const mk=(o)=>{o.narration=o.parts.map(x=>x.t).join(' ');if(o.lineParts)o.lines=o.parts.filter(x=>x.l).map(x=>x.l);return o;};
  let years=null;

    if(ys.length) years=new Date().getFullYear()-Math.min(...ys);}
  if(years!==null&&(years<1||years>45)) years=null;
  const hl=clean(c.headline||'');
  // 1. intro
  const ip=[{t:`Hi, I'm ${c.name}${hl?', '+article(hl)+' '+hl:''}.`,p:0}];
  if(years) ip.push({t:`I bring ${years} years of experience.`,p:2});

  // 2. experience
  const expE=picked(sec('experience'));
  const pool=[];
  expE.forEach(e=>e.bullets.filter(b=>b.on).forEach(b=>pool.push({t:b.t,sc:scoreBullet(b.t)})));
  const top=pool.map((x,i)=>({...x,i})).sort((x,y)=>y.sc-x.sc||x.i-y.i).slice(0,3);

  if(cp.length) out.push(mk({kind:'credentials',label:'Background',title:'Background & recognition',sub:'',lines:[],parts:cp,lineParts:true}));
  // 6. outro

  if(c.email) op.push({t:`You can reach me at ${c.email.replace('@',' at ')}.`,p:10});
  const cred=[['STARRING',c.name]];
  if(hl) cred.push(['ROLE',hl]);

  outroScene.credits=cred;out.push(outroScene);

/* ---------- own voice recording ---------- */
let recState=null;
async function decodeTrim(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  try{
    const buf=await ac.decodeAudioData(await blob.arrayBuffer());
    const d=buf.getChannelData(0);let a=0,b=d.length-1;const thr=.012;
    while(a<b&&Math.abs(d[a])<thr) a++;
    while(b>a&&Math.abs(d[b])<thr) b--;
    const pad=Math.floor(buf.sampleRate*.12);a=Math.max(0,a-pad);b=Math.min(d.length-1,b+pad);
    const out=ac.createBuffer(buf.numberOfChannels,b-a+1,buf.sampleRate);
    for(let ch=0;ch<buf.numberOfChannels;ch++) out.copyToChannel(buf.getChannelData(ch).slice(a,b+1),ch);
    return out;
  }finally{try{ac.close();}catch(e){}}
}
function playBuf(buf){
  if(!buf) return;
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start();src.onended=()=>{try{ac.close();}catch(e){}};
}
async function voiceAction(a,i){
  const c=cur(),s=c.scenes[i];
  if(a==='clr'){s.userBuf=null;renderScenes();return;}
  if(a==='play'){playBuf(s.userBuf);return;}
  if(recState){recState.rec.stop();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const chunks=[],rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data);};
    rec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:rec.mimeType});recState=null;
      try{s.userBuf=await decodeTrim(blob);}catch(e){alert('Could not read that recording — please try again.');}
      renderScenes();
    };
    recState={i,rec};rec.start();renderScenes();
  }catch(e){recState=null;alert('Could not use the microphone ('+(e.message||e)+'). Check that this page is allowed to use it, then try again.');renderScenes();}
}

  }

/* ---------- fast (non-real-time) export via WebCodecs ----------

   so a 60s video always took >=60s to "create" no matter what. This path
   draws every frame straight to an encoder as fast as the device can push
   them (no waiting for audio/animation to play out), then mixes the audio
   offline. On a phone that supports it, this is typically many times
   faster than real time. If the browser doesn't support it, or anything

    }catch(e){}

}
async function runFast(my,scenes,bufs,rate,durs,total){

  renderScenes();
});
$('#addScene').onclick=()=>{const sc=cur().scenes;sc.splice(Math.max(1,sc.length-1),0,{kind:'custom',label:'Highlight',title:'New scene',sub:'',lines:['Add your point here'],narration:'Add your narration here.'});renderScenes();};
$('#resetScript').onclick=()=>{if(confirm('Discard your script edits and rebuild from the selected content?')){cur().scenes=buildScenes(cur());renderScenes();}};
$('#rerender').onclick=makeVideo;
$('#stop').onclick=stopAll;
$('#back2').onclick=()=>{if(cur()?.isPreview){closeFormatPreview(false);return;}stopAll();go(1);};
$('#s2Close').onclick=()=>{if(cur()?.isPreview){closeFormatPreview(false);return;}stopAll();go(1);};
$('#stop').disabled=true;
refreshAvatars();mkRender();refreshFmtThumbs();
// quietly start downloading the AI voice model in the background while the
// person is still filling in their details, so it's ready (not a wait) by
// the time a video is actually created. Runs once the browser is idle so it
// never competes with the person actively typing/tapping, and only once —
// window.loadTTS() itself de-dupes, so this is always safe to call again.
const prewarmTTS=()=>{if(settings.voiceMode!=='own'){try{window.loadTTS(null,settings.voiceName).catch(()=>{});}catch(e){}}};
if('requestIdleCallback' in window) requestIdleCallback(prewarmTTS,{timeout:4000});
else setTimeout(prewarmTTS,2500);
</script>
</body>
</html>
